# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
  pull_request:
  schedule:
    - cron: '0 0,12 * * *'

env: 
  imagetag: ${{ github.head_ref || github.ref_name || 'dev' }}
  branch: ${{ github.head_ref || github.ref_name || 'dev' }}
  node_version: '24'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  
      
      - name: "image tag"
        run: echo "image tag set to '${{ env.imagetag }}'"

      - name: Build and push builder image
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile.builder
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          build-args: |
            BASE_IMAGE_RELEASE=latest
            BASE_IMAGE=ubuntu
            BRANCH=${{ env.branch }}
            NODE_MAJOR=${{ env.node_version }}
          tags: |
            ghcr.io/abcdesktopio/oc.nginx.builder:${{ env.imagetag }}

      - name: Build and push oc.nginx image
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          build-args: |
            BASE_IMAGE_RELEASE=${{ env.imagetag }}
            BASE_IMAGE=ghcr.io/abcdesktopio/oc.nginx.builder
            BRANCH=${{ env.branch }}
            TARGET=prod
            NODE_MAJOR=${{ env.node_version }}
          tags: |
            ghcr.io/abcdesktopio/oc.nginx:${{ env.imagetag }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/abcdesktopio/oc.nginx:${{ env.imagetag }}
          format: 'table'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

